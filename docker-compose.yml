services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - pulse-data:/app/backend/data
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pulse-data: