services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - pulse-data:/app/backend/data
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - PORT=8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:-host.docker.internal}
      - BACKEND_PORT=${BACKEND_PORT:-8001}
    depends_on:
      - backend

volumes:
  pulse-data:
